# pyproject.toml — for extracting adaptive_profiler into a standalone package.
#
# To use: move this file one level up (next to the adaptive_profiler/ folder),
# then run:  pip install -e .
#            pip install -e ".[s3]"     # include boto3 for S3 storage
#            pip install -e ".[dev]"    # include pytest for running tests

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "adaptive-profiler"
version = "0.2.0"
description = "AutoML anomaly detection and schema-driven data quality for ETL pipelines"
readme = "adaptive_profiler/README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "optuna>=3.0",
    "pyod>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["adaptive_profiler/tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["adaptive_profiler*"]
