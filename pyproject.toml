[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "adaptive-profiler"
version = "0.1.0"
description = "AutoML anomaly detection and schema-driven quality profiling for tabular time-series data"
authors = [{ name = "Koorosh Komeilizadeh", email = "kkomeilizadeh@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["anomaly-detection", "data-quality", "automl", "pyod", "optuna", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyod>=1.1",
    "optuna>=3.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.26", "botocore>=1.29"]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy", "boto3>=1.26"]

[project.urls]
Homepage = "https://github.com/kooroshkz/adaptive-data-profiling-etl"

[tool.setuptools.packages.find]
include = ["adaptive_profiler*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
