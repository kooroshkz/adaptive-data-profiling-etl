[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-data-profiling-etl"
version = "1.0.0"
description = "Weather data ETL pipeline with AutoML anomaly detection"
authors = [{ name = "Koorosh Komeili Zadeh", email = "kkomeilizadeh@gmail.com" }]
requires-python = ">=3.10"

dependencies = [
    "adaptive-profiler>=0.2.0",   # https://github.com/kooroshkz/adaptive-profiler
    "duckdb>=1.1",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
s3  = ["boto3>=1.26"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/kooroshkz/adaptive-data-profiling-etl"
"Profiler library" = "https://github.com/kooroshkz/adaptive-profiler"

[tool.ruff]
line-length = 100
target-version = "py310"
