version: 2

models:
  - name: weather_daily_with_anomalies
    description: Daily weather aggregates computed from raw data with synthetic anomalies included
    columns:
      - name: city_id
        description: City identifier
        tests:
          - not_null
      - name: date
        description: Date of aggregation
        tests:
          - not_null
      - name: temperature_2m_avg
        description: Average daily air temperature
      - name: precipitation_total
        description: Total daily precipitation
      - name: total_hours
        description: Number of hourly records aggregated
        tests:
          - not_null
      - name: anomaly_hours
        description: Number of hourly rows flagged as synthetic anomalies

  - name: weather_daily_without_anomalies
    description: Daily weather aggregates computed from raw data after removing synthetic anomaly rows
    columns:
      - name: city_id
        description: City identifier
        tests:
          - not_null
      - name: date
        description: Date of aggregation
        tests:
          - not_null
      - name: temperature_2m_avg
        description: Average daily air temperature (cleaned)
      - name: precipitation_total
        description: Total daily precipitation (cleaned)
      - name: total_hours
        description: Number of hourly records aggregated after anomaly removal
        tests:
          - not_null
