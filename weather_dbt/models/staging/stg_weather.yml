version: 2

models:
  - name: stg_weather
    description: Hourly weather data with six selected API variables plus synthetic anomaly metadata
    columns:
      - name: time
        description: Measurement timestamp
        tests:
          - not_null
      - name: date
        description: Date of measurement
        tests:
          - not_null
      - name: city_id
        description: City identifier
        tests:
          - not_null
          - relationships:
              to: source('raw', 'weather_hourly')
              field: city_id
      - name: temperature_2m
        description: Air temperature measured 2 meters above ground
      - name: apparent_temperature
        description: Feels-like temperature
      - name: precipitation
        description: Total rain and snow in mm
      - name: surface_pressure
        description: Pressure at ground level
      - name: soil_temperature_7_to_28cm
        description: Soil temperature in 7-28 cm depth
      - name: soil_moisture_7_to_28cm
        description: Soil moisture in 7-28 cm depth
      - name: synthetic_anomaly_flag
        description: True if any tracked weather variable was synthetically shifted
      - name: synthetic_anomaly_details_json
        description: JSON map of per-column anomaly details for this row
    tests:
      - unique:
          column_name: "time || '_' || city_id || '_' || batch_id"
