name: dbt Transformations

on:
  # Trigger via webhook from Airflow
  repository_dispatch:
    types: [trigger-dbt-transform]
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Date to process (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  dbt-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dbt and dependencies
      run: |
        pip install dbt-core dbt-duckdb boto3 pyarrow pandas duckdb==1.5.2
        
    - name: Configure AWS credentials
      run: |
        mkdir -p ~/.aws
        cat > ~/.aws/credentials << EOF
        [default]
        aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        EOF
        cat > ~/.aws/config << EOF
        [default]
        region = ${{ secrets.AWS_REGION }}
        EOF
        
    - name: Create dbt profiles.yml
      run: |
        mkdir -p ~/.dbt
        cat > ~/.dbt/profiles.yml << 'EOF'
        weather_dbt:
          outputs:
            prod:
              type: duckdb
              path: ':memory:'
              schema: main
              threads: 2
              extensions:
                - httpfs
                - parquet
              settings:
                s3_region: ${{ secrets.AWS_REGION }}
                s3_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                s3_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          target: prod
        EOF
        
    - name: Test S3 connectivity
      run: |
        python3 << 'PYEOF'
        import duckdb
        import os
        
        # Test S3 read access
        con = duckdb.connect(':memory:')
        con.execute("INSTALL httpfs; LOAD httpfs;")
        con.execute(f"SET s3_region='{os.getenv('AWS_REGION', 'us-east-1')}';")
        con.execute(f"SET s3_access_key_id='{os.getenv('AWS_ACCESS_KEY_ID')}';")
        con.execute(f"SET s3_secret_access_key='{os.getenv('AWS_SECRET_ACCESS_KEY')}';")
        
        bucket = os.getenv('S3_BUCKET', 'weather-data-koorosh-thesis')
        result = con.execute(f"SELECT COUNT(*) FROM read_parquet('s3://{bucket}/raw/city=*/hourly_*.parquet', hive_partitioning=true)").fetchone()
        print(f"Successfully read {result[0]} rows from S3")
        con.close()
        PYEOF
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
        
    - name: Run dbt debug
      run: |
        cd weather_dbt
        dbt debug
        
    - name: Run dbt deps
      run: |
        cd weather_dbt
        dbt deps
        
    - name: Run dbt transformations
      run: |
        cd weather_dbt
        dbt clean
        DBT_PARTIAL_PARSE=0 dbt run --full-refresh
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
        
    - name: Refresh MotherDuck views
      run: |
        python3 airflow/scripts/refresh_motherduck_views.py
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
        MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        
    - name: Summary
      run: |
        echo "dbt transformation pipeline completed!"
        echo ""
        echo "MotherDuck views refreshed:"
        echo "  - raw_weather_data.main.<city>"
        echo "  - weather_analytics.main.weather_daily_with_anomalies_<city>"
        echo "  - weather_analytics.main.weather_daily_without_anomalies_<city>"
        echo ""
        echo "Cities: amsterdam, new_york, london, paris, tokyo"
        echo ""
