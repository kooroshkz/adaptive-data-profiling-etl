x-airflow-common:
  &airflow-common
  image: apache/airflow:2.10.3-python3.12
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # Memory optimizations for t3.small (2GB RAM, 2 vCPUs)
    AIRFLOW__WEBSERVER__WORKERS: 2  # Use both vCPUs
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: 300  # 5 min timeout
    AIRFLOW__CORE__PARALLELISM: 16
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1  # Run 1 task simultaneously
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: 2  # Use both cores
    # Install additional Python packages
    _PIP_ADDITIONAL_REQUIREMENTS: duckdb==1.1.3 boto3==1.35.80 requests==2.32.3 pandas==2.2.3 pyarrow==18.1.0
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_REGION: ${AWS_REGION}
    S3_BUCKET: ${S3_BUCKET}
    MOTHERDUCK_TOKEN: ${MOTHERDUCK_TOKEN}
    GITHUB_TOKEN: ${GITHUB_TOKEN}
    GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-kooroshkz}
    GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-adaptive-data-profiling-etl}
    BREVO_API_KEY: ${BREVO_API_KEY}
    BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
    BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Airflow Weather Pipeline}
    BREVO_ALERT_EMAIL: ${BREVO_ALERT_EMAIL}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ../data:/opt/airflow/project-data
    - ../adaptive_profiler:/opt/adaptive_profiler
    - ../profiling_schema.yml:/opt/profiling_schema.yml
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    # Memory limit for postgres (more than t3micro)
    deploy:
      resources:
        limits:
          memory: 384M  # 256M → 384M (we have 2GB total)

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 2 min (faster than t3micro's 3min)
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
    deploy:
      resources:
        limits:
          memory: 896M

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 2 min (faster than t3micro's 3min)
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
    # Memory limit for scheduler (increased for more tasks)
    deploy:
      resources:
        limits:
          memory: 768M  # 512M → 768M (handle 16 parallel tasks)

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins /sources/data/raw /sources/data/staging
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins,data}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    volumes:
      - .:/sources

volumes:
  postgres-db-volume:
